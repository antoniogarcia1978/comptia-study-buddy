{id:"c2-4.2-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.2",objectiveText:"Explain basic change management best practices.",question:"A critical security vulnerability is being actively exploited in production. The standard change management approval takes 2 weeks. Which change type allows the organization to bypass the standard timeline for urgent situations?",options:["Standard change","Normal change","Emergency change","Routine maintenance window"],correct:2,explanation:"An emergency change provides an expedited approval path for changes that must be implemented immediately due to active security exploits, system outages, or other critical business situations. It still requires documentation and post-implementation review but bypasses the standard scheduling queue. Emergency approval authority may be delegated to on-call management or convene an emergency CAB meeting.",wrongReasons:["A standard change is a pre-approved, low-risk, repeatable change that follows normal procedures; it does not accelerate approval timelines.","A normal change follows the full change management process with defined lead times and CAB approval; it is not designed for urgent situations.",null,"A routine maintenance window is a scheduled time for planned work; it does not provide an expedited approval mechanism for emergency security patches."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.2 — Change Management",source2:"Professor Messer A+ 220-1202, Section 4.2 — Change Management",messerSection:"4.2",difficulty:"medium"},
{id:"c2-4.3-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.3",objectiveText:"Given a scenario, implement workstation backup and recovery methods.",question:"A backup system performs a full backup on Sunday, then incremental backups each weekday. The server fails on Friday afternoon. How many backup sets are required to fully restore to Thursday's state?",options:["Only Thursday's incremental","Only Sunday's full backup","The Sunday full backup plus Monday, Tuesday, Wednesday, and Thursday incrementals","Only the most recent two backups"],correct:2,explanation:"Incremental backups only capture data changed since the LAST backup (whether full or incremental). To restore Thursday: apply Sunday's full backup (baseline), then apply Monday's incremental (adds Monday's changes only), then Tuesday's, then Wednesday's, then Thursday's. Every incremental in the chain is required because each contains only that single day's changes.",wrongReasons:["Thursday's incremental only contains changes since Wednesday; restoring only it would give an incomplete restore missing all earlier changes.","Sunday's full backup restores the system to Sunday's state; all changes from Monday through Thursday would be permanently lost.",null,"Each incremental backup only contains changes since the previous backup — not since Sunday's full. Multiple backup sets are always required for incremental restoration."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.3 — Backup and Recovery",source2:"Professor Messer A+ 220-1202, Section 4.3 — Backup Methods",messerSection:"4.3",difficulty:"medium"},
{id:"c2-4.3-002",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.3",objectiveText:"Given a scenario, implement workstation backup and recovery methods.",question:"A backup policy requires 3 total copies of data, stored on 2 different media types, with 1 copy kept off-site. Which industry backup strategy is this?",options:["GFS (Grandfather-Father-Son) rotation","Full plus differential backup","3-2-1 backup rule","RAID 5 redundancy"],correct:2,explanation:"The 3-2-1 backup rule is an industry best practice: 3 copies of data (1 primary + 2 backups), on 2 different storage media types (e.g., internal drive + external tape or cloud), with 1 copy stored off-site. The off-site copy ensures survival of local disasters — fire, flood, theft, or ransomware encrypting all local systems simultaneously.",wrongReasons:["GFS (Grandfather-Father-Son) is a backup rotation schedule defining retention periods for daily, weekly, and monthly backups; it does not describe the media distribution and copy-count strategy.","Full plus differential describes backup types (full backup followed by backups of all changes since the last full); it is not a media distribution strategy.",null,"RAID 5 provides storage redundancy against drive failure on a single system; it is not a backup strategy and does not protect against accidental deletion, ransomware, or off-site disasters."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.3 — Backup Strategies",source2:"Professor Messer A+ 220-1202, Section 4.3 — Backup Strategies",messerSection:"4.3",difficulty:"easy"},
{id:"c2-4.4-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.4",objectiveText:"Explain common safety procedures.",question:"Before handling RAM modules, PCIe cards, or a CPU, what should a technician do to prevent electrostatic discharge (ESD) damage to components?",options:["Work on a metal workbench","Wear rubber insulating gloves","Put on an ESD wrist strap connected to a grounded surface","Blow compressed air to discharge static"],correct:2,explanation:"An ESD wrist strap connects the technician's wrist (skin contact) to a grounded reference (chassis or grounding mat) through a 1-megaohm resistor. This continuously equalizes the electrical potential between the technician and sensitive components, preventing the static charge buildup that can permanently damage semiconductor devices such as RAM, CPUs, and PCIe cards.",wrongReasons:["A metal workbench alone is not sufficient — it may actually create a direct discharge path if not bonded to a grounding mat; by itself it does not equalize the technician's potential.","Rubber gloves are insulators that trap static electricity; they can actually make ESD damage more likely by preventing charge dissipation.",null,"Compressed air removes dust; it has no effect on the technician's electrostatic charge and does not prevent ESD damage."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.4 — Safety Procedures",source2:"Professor Messer A+ 220-1202, Section 4.4 — Safety Procedures",messerSection:"4.4",difficulty:"easy"},
{id:"c2-4.5-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.5",objectiveText:"Explain environmental impacts and appropriate controls.",question:"A server room loses utility power. A device connected between the power outlet and the servers immediately provides battery power, allowing systems to continue running and giving time for graceful shutdown or generator start. What is this device?",options:["Surge protector","PDU (Power Distribution Unit)","UPS (Uninterruptible Power Supply)","KVM switch"],correct:2,explanation:"A UPS (Uninterruptible Power Supply) contains batteries that supply power instantaneously when utility power fails — there is no switching delay. This prevents data corruption and hardware damage from sudden power loss. UPS units also condition power (filtering surges, sags, and line noise) and provide runtime to allow safe system shutdown or generator transfer.",wrongReasons:["A surge protector absorbs voltage spikes from the power line but provides zero battery backup; when power fails completely, a surge protector provides no power at all.","A PDU (Power Distribution Unit) distributes power from a single source to multiple receptacles and may include monitoring; it has no battery backup capability.",null,"A KVM switch allows one keyboard, monitor, and mouse to control multiple servers; it has no power protection, battery, or UPS functionality."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.5 — Environmental Controls",source2:"Professor Messer A+ 220-1202, Section 4.5 — Environmental Controls",messerSection:"4.5",difficulty:"easy"},
{id:"c2-4.6-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.6",objectiveText:"Explain the processes for incident response.",question:"A forensic analyst is collecting evidence from a running system. The order of volatility requires collecting the most volatile data first. Which data source is the MOST volatile and must be collected first?",options:["Contents of the local hard drive","Remote network shares","CPU registers and CPU cache","Archived backup tapes"],correct:2,explanation:"The order of volatility (most to least): CPU registers and cache → RAM → Swap/page file → Local disk → Remote network storage → Archival/backup media. CPU registers contain the currently executing instructions and operand data that is lost the instant the CPU state changes or loses power. This data must be captured first while the system remains running.",wrongReasons:["Local hard drive contents are non-volatile and persist after power loss; they should be forensically imaged after more volatile data is collected.","Remote network shares are the least volatile of the live data sources listed; they persist on remote servers and can be collected after local volatile data.",null,"Archival backup tapes retain data for years without power; they are the least volatile storage medium and are collected last in the order of volatility."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.6 — Incident Response",source2:"Professor Messer A+ 220-1202, Section 4.6 — Incident Response",messerSection:"4.6",difficulty:"hard"},
{id:"c2-4.6-002",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.6",objectiveText:"Explain the processes for incident response.",question:"A chain of custody document is maintained throughout a forensic investigation. What is the PRIMARY purpose of chain of custody documentation?",options:["To create backup copies of forensic disk images","To ensure evidence integrity and legal admissibility by tracking who handled evidence and when","To speed up the forensic investigation process","To allow multiple analysts to work on the same original device simultaneously"],correct:1,explanation:"Chain of custody documents every individual who accessed, collected, transferred, analyzed, or stored evidence — along with the date, time, and purpose. This creates an unbroken record proving evidence was not tampered with from collection through court presentation. Without proper chain of custody, evidence may be challenged as tainted and deemed inadmissible.",wrongReasons:["Creating forensic image copies is a separate technical task performed by the analyst; chain of custody is a documentation and tracking process.",null,"Chain of custody adds procedural rigor with required documentation; speed is not its purpose and proper custody procedures may add time.","Multiple analysts working on the same original evidence simultaneously would contaminate the evidence and break chain of custody; forensic copies (bit-for-bit images) are used for analysis instead."],source1:"CompTIA A+ 220-1202 Official Objectives, Domain 4.6 — Incident Response",source2:"Professor Messer A+ 220-1202, Section 4.6 — Incident Response",messerSection:"4.6",difficulty:"medium"},
{id:"c2-4.8-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.6",objectiveText:"Explain the importance of prohibited content/activity and privacy, licensing, and policy concepts.",question:"A company purchases software that requires an annual payment renewal. If they stop paying, access is revoked. Which software license model does this describe?",options:["Perpetual license","Open-source license","Subscription license","Site license"],correct:2,explanation:"A subscription license requires ongoing periodic payments (monthly or annually) to maintain access. If the subscription lapses, the software deactivates or loses full functionality. Microsoft 365, Adobe Creative Cloud, and most modern SaaS tools use subscription licensing. This contrasts with perpetual licenses where a one-time payment grants indefinite use of that version.",wrongReasons:["A perpetual license grants permanent usage rights for the software version purchased after a single payment; no renewals are required to continue using the software.","An open-source license (GPL, MIT, Apache) grants rights to use, modify, and distribute software freely under specific conditions; it is not a payment model.",null,"A site license grants usage rights for a fixed location or unlimited users at an organization, typically as a perpetual or annual purchase; it describes the scope of licensing, not payment frequency."],source1:"CompTIA A+ 220-1202 Official Objectives v3.0, Domain 4.6 — Privacy and Licensing",source2:"Professor Messer A+ 220-1202, Section 4.6 — Privacy and Policies",messerSection:"4.6",difficulty:"easy"},
{id:"c2-4.9-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.7",objectiveText:"Given a scenario, use proper communication techniques and professionalism.",question:"A technician is repairing a user's laptop and notices personal financial documents and private photos visible on the desktop. What is the MOST professional action?",options:["Browse the files to better understand the user's computing habits","Screenshot sensitive documents in case they are evidence of wrongdoing","Focus only on the authorized repair task and avoid accessing or viewing any personal files","Delete the personal files to improve system organization"],correct:2,explanation:"Professional technicians must respect user privacy. Their authorization is limited to the specific repair task — not browsing, copying, or viewing personal data. Unauthorized access to personal files may violate privacy laws (like CFAA), professional codes of ethics, and company policies. Only access what is explicitly required to complete the assigned work.",wrongReasons:["Browsing personal files without authorization is a serious breach of professional ethics and privacy, even with good intentions.","Screenshotting personal documents without authorization constitutes unauthorized data collection and potentially illegal privacy violation.",null,"Deleting user files without explicit permission — even under the guise of cleanup — could destroy irreplaceable personal data and constitutes unauthorized system modification."],source1:"CompTIA A+ 220-1202 Official Objectives v3.0, Domain 4.7 — Communication and Professionalism",source2:"Professor Messer A+ 220-1202, Section 4.7 — Communication and Professionalism",messerSection:"4.7",difficulty:"easy"},
{id:"c2-4.10-001",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.8",objectiveText:"Explain the basics of scripting.",question:"A Windows administrator creates a script that automates user account creation across multiple servers. The file uses the .ps1 extension. Which scripting environment does this file use?",options:["Python (.py extension)","Batch file (.bat extension)","PowerShell (.ps1 extension)","Bash (.sh extension)"],correct:2,explanation:"PowerShell scripts use the .ps1 file extension. PowerShell is Microsoft's task automation and configuration management framework built on .NET, providing cmdlets for managing Windows, Active Directory, Azure, and Microsoft 365. Execution of .ps1 scripts is controlled by the system's execution policy (Get-ExecutionPolicy / Set-ExecutionPolicy).",wrongReasons:["Python scripts use the .py extension; while Python runs on Windows, it is not the native Windows automation framework associated with .ps1 files.","Batch files use the .bat or .cmd extension and use legacy Command Prompt syntax; they are far less capable than PowerShell for modern Windows administration.",null,"Bash scripts use the .sh extension and run primarily on Linux/macOS; while Windows Subsystem for Linux (WSL) supports Bash, .sh files are not Windows PowerShell scripts."],source1:"CompTIA A+ 220-1202 Official Objectives v3.0, Domain 4.8 — Scripting",source2:"Professor Messer A+ 220-1202, Section 4.8 — Scripting",messerSection:"4.8",difficulty:"easy"},
{id:"c2-4.10-002",exam:"core2",domainNum:"4.0",domainName:"Operational Procedures",objective:"4.10",objectiveText:"Explain basic concepts related to artificial intelligence (AI).",question:"An AI assistant confidently states that a specific medication dosage is safe, but the information is incorrect — the AI generated it based on statistical patterns in training data rather than verified medical facts. What type of AI error is this?",options:["A zero-day vulnerability","An AI hallucination","A false positive detection","A logic bomb"],correct:1,explanation:"An AI hallucination occurs when a generative AI model produces confident-sounding but factually incorrect, fabricated, or unsupported content. This happens because AI models generate responses based on statistical patterns in training data rather than verified real-world knowledge. Critical verification from authoritative sources is essential, especially for high-stakes domains like medicine, law, and security.",wrongReasons:["A zero-day vulnerability is an unpatched software security flaw unknown to the vendor; it has no relation to AI generating incorrect factual content.",null,"A false positive in security is when a benign item is incorrectly flagged as malicious (e.g., antivirus flagging a safe file); it is not the term for AI-generated inaccurate content.","A logic bomb is malicious code triggered by a specific condition or date; it has no relation to AI models generating incorrect responses."],source1:"CompTIA A+ 220-1202 Official Objectives v3.0, Domain 4.10 — Artificial Intelligence",source2:"Professor Messer A+ 220-1202, Section 4.10 — Artificial Intelligence",messerSection:"4.10",difficulty:"medium"}
];

// ─── STATE ───────────────────────────────────────────────────────
let STATE = {
  user: null,
  exam: 'core1',
  quizQ: [],
  quizIdx: 0,
  quizCorrect: 0,
  quizAnswered: false,
  drillMode: false,
  progress: {} // key: qid → {answered, correct, attempts}
};

function storageKey() { return `csb_v3_${STATE.user}`; }

function loadProgress() {
  const raw = localStorage.getItem(storageKey());
  STATE.progress = raw ? JSON.parse(raw) : {};
}

function saveProgress() {
  localStorage.setItem(storageKey(), JSON.stringify(STATE.progress));
}

function recordResult(qid, correct) {
  if (!STATE.progress[qid]) STATE.progress[qid] = {answered:0, correct:0, attempts:0};
  STATE.progress[qid].attempts++;
  STATE.progress[qid].answered = true;
  if (correct) STATE.progress[qid].correct++;
  saveProgress();
}

// ─── NAVIGATION ──────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function selectUser(name) {
  STATE.user = name;
  loadProgress();
  document.getElementById('dash-username').textContent = name;
  switchExam('core1');
  showScreen('screen-dashboard');
}

// ─── DASHBOARD ───────────────────────────────────────────────────
function switchExam(exam) {
  STATE.exam = exam;
  document.getElementById('tab-core1').classList.toggle('active', exam==='core1');
  document.getElementById('tab-core2').classList.toggle('active', exam==='core2');
  renderDashboard();
}

function renderDashboard() {
  const exam = STATE.exam;
  const isC1 = exam === 'core1';
  document.getElementById('dash-exam-label').textContent = isC1 ? 'Core 1 — 220-1201' : 'Core 2 — 220-1202';
  document.getElementById('dash-pass-info').textContent = isC1
    ? 'Pass: 675/900 · 90 Q · 90 min'
    : 'Pass: 700/900 · 90 Q · 90 min';

  const examQs = QUESTIONS.filter(q => q.exam === exam);
  const domains = [...new Set(examQs.map(q => q.domainNum))].sort();

  let totalAnswered = 0, totalCorrect = 0;
  let domainHTML = '';

  domains.forEach(dn => {
    const dqs = examQs.filter(q => q.domainNum === dn);
    const key = exam[0]+'1-'+dn; // "c1-1.0" style unused here — use exam prefix
    const domKey = exam.substring(0,5) + '-' + dn;
    let ans = 0, cor = 0;
    dqs.forEach(q => {
      const p = STATE.progress[q.id];
      if (p && p.answered) { ans++; if(p.correct>0) cor++; }
    });
    totalAnswered += ans;
    totalCorrect += cor;
    const pct = dqs.length ? Math.round((cor/dqs.length)*100) : 0;
    const color = pct >= 75 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
    const dname = dqs[0].domainName;
    domainHTML += `<div class="domain-row">
      <div class="row"><span class="domain-label">${dn} ${dname}</span><span style="font-size:12px;color:${color}">${cor}/${dqs.length} (${pct}%)</span></div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  });

  const totalQ = examQs.length;
  const readiness = totalQ ? Math.round((totalCorrect/totalQ)*100) : 0;
  document.getElementById('dash-readiness').textContent = readiness + '%';
  document.getElementById('dash-domains').innerHTML = domainHTML;
}

// ─── QUIZ SETUP ──────────────────────────────────────────────────
function showQuizSetup() {
  const sel = document.getElementById('setup-exam');
  sel.value = STATE.exam === 'both' ? 'both' : STATE.exam;
  updateDomainOptions();
  showScreen('screen-quiz-setup');
  document.getElementById('setup-exam').onchange = updateDomainOptions;
  updateAvailableCount();
  document.getElementById('setup-count').oninput = function() {
    document.getElementById('setup-count-label').textContent = this.value;
    updateAvailableCount();
  };
  ['setup-exam','setup-domain','setup-diff'].forEach(id =>
    document.getElementById(id).onchange = updateAvailableCount
  );
}

function updateDomainOptions() {
  const exam = document.getElementById('setup-exam').value;
  const dd = document.getElementById('setup-domain');
  const current = dd.value;
  dd.innerHTML = '<option value="all">All Domains</option>';
  const qs = exam === 'both' ? QUESTIONS : QUESTIONS.filter(q => q.exam === exam);
  const domains = [...new Set(qs.map(q => `${q.domainNum}|${q.domainName}`))].sort();
  domains.forEach(d => {
    const [num, name] = d.split('|');
    const o = document.createElement('option');
    o.value = num;
    o.textContent = `${num} ${name}`;
    dd.appendChild(o);
  });
  updateAvailableCount();
}

function getFilteredQ() {
  const exam = document.getElementById('setup-exam').value;
  const domain = document.getElementById('setup-domain').value;
  const diff = document.getElementById('setup-diff').value;
  return QUESTIONS.filter(q =>
    (exam === 'both' || q.exam === exam) &&
    (domain === 'all' || q.domainNum === domain) &&
    (diff === 'all' || q.difficulty === diff)
  );
}

function updateAvailableCount() {
  const count = getFilteredQ().length;
  document.getElementById('setup-available').textContent = `${count} questions match these filters`;
  document.getElementById('setup-count').max = Math.max(5, count);
}

function shuffle(arr) {
  for (let i = arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(forcedQs) {
  let pool;
  if (forcedQs) {
    pool = forcedQs;
  } else {
    pool = getFilteredQ();
    const count = parseInt(document.getElementById('setup-count').value);
    pool = shuffle([...pool]).slice(0, count);
  }
  if (!pool.length) { alert('No questions match these filters.'); return; }
  STATE.quizQ = pool;
  STATE.quizIdx = 0;
  STATE.quizCorrect = 0;
  STATE.drillMode = !!forcedQs;
  showScreen('screen-quiz');
  renderQuestion();
}

// ─── QUIZ ENGINE ─────────────────────────────────────────────────
function renderQuestion() {
  const q = STATE.quizQ[STATE.quizIdx];
  STATE.quizAnswered = false;
  document.getElementById('q-progress').textContent =
    `Q ${STATE.quizIdx+1} of ${STATE.quizQ.length} · ${STATE.quizCorrect} correct`;
  document.getElementById('q-domain-label').textContent =
    `${q.exam==='core1'?'Core 1':'Core 2'} · ${q.domainNum} ${q.domainName} · Obj ${q.objective}`;
  const diffMap = {easy:'diff-easy',medium:'diff-medium',hard:'diff-hard'};
  document.getElementById('q-diff-badge').innerHTML =
    `<span class="diff ${diffMap[q.difficulty]||'diff-medium'}">${q.difficulty}</span>`;
  document.getElementById('q-text').textContent = q.question;
  const optDiv = document.getElementById('q-options');
  optDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = `${String.fromCharCode(65+i)}. ${opt}`;
    btn.onclick = () => answerQ(i, btn, q);
    optDiv.appendChild(btn);
  });
  document.getElementById('q-feedback').style.display = 'none';
  document.getElementById('q-next-btn').textContent =
    STATE.quizIdx === STATE.quizQ.length-1 ? 'See Results' : 'Next Question';
}

function answerQ(chosen, btn, q) {
  if (STATE.quizAnswered) return;
  STATE.quizAnswered = true;
  const correct = chosen === q.correct;
  if (correct) STATE.quizCorrect++;
  recordResult(q.id, correct);

  const opts = document.querySelectorAll('.option-btn');
  opts.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correct) b.classList.add(correct && i===chosen ? 'correct' : 'reveal-correct');
  });
  if (!correct) btn.classList.add('wrong');

  // Show explanation
  let expHTML = `<strong>${correct ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${q.explanation}`;
  if (!correct && q.wrongReasons && q.wrongReasons[chosen]) {
    expHTML += `<div class="wrong-reason">Why your choice was wrong: ${q.wrongReasons[chosen]}</div>`;
  }
  document.getElementById('q-explanation').innerHTML = expHTML;
  document.getElementById('q-sources').textContent =
    `${q.source1} | ${q.source2}`;
  document.getElementById('q-feedback').style.display = 'block';
}

function nextQuestion() {
  STATE.quizIdx++;
  if (STATE.quizIdx >= STATE.quizQ.length) {
    showSummary();
  } else {
    renderQuestion();
  }
}

function endQuiz() {
  if (confirm('End quiz and see results?')) showSummary();
}

function showSummary() {
  const total = STATE.quizIdx > STATE.quizQ.length ? STATE.quizQ.length : Math.min(STATE.quizIdx+1, STATE.quizQ.length);
  const answered = STATE.quizIdx >= STATE.quizQ.length ? STATE.quizQ.length : STATE.quizIdx;
  const correct = STATE.quizCorrect;
  const pct = answered ? Math.round((correct/answered)*100) : 0;
  document.getElementById('sum-score').textContent = pct + '%';
  document.getElementById('sum-detail').textContent = `${correct} of ${answered} correct`;
  const rating = pct >= 80 ? '🟢 Exam Ready!' : pct >= 65 ? '🟡 Getting There' : '🔴 Keep Studying';
  document.getElementById('sum-rating').textContent = rating;

  // Domain breakdown
  const byDomain = {};
  STATE.quizQ.slice(0, answered).forEach((q, i) => {
    const key = `${q.domainNum} ${q.domainName}`;
    if (!byDomain[key]) byDomain[key] = {cor:0, tot:0};
    byDomain[key].tot++;
    const p = STATE.progress[q.id];
    // Check if last attempt was correct: we track cumulatively, approximate with answered/correct ratio for this session
  });

  let brkHTML = '<h3 class="mb8">Domain Breakdown</h3>';
  // Simple approach: count from quizQ
  const domScore = {};
  STATE.quizQ.slice(0, answered).forEach((q,i) => {
    const key = `${q.domainNum} ${q.domainName}`;
    if (!domScore[key]) domScore[key] = {cor:0,tot:0};
    domScore[key].tot++;
  });
  // We need to track per-question in this session
  // Use sessionResults stored during answerQ
  Object.keys(STATE.sessionResults||{}).forEach(qid => {
    const r = STATE.sessionResults[qid];
    const q = QUESTIONS.find(x=>x.id===qid);
    if (!q) return;
    const key = `${q.domainNum} ${q.domainName}`;
    if (!domScore[key]) domScore[key] = {cor:0,tot:0};
    if (r) domScore[key].cor++;
  });
  Object.entries(domScore).forEach(([k,v]) => {
    const pct2 = v.tot ? Math.round((v.cor/v.tot)*100) : 0;
    const color = pct2>=75?'var(--green)':pct2>=50?'var(--yellow)':'var(--red)';
    brkHTML += `<div class="row mt8"><span style="font-size:13px">${k}</span><span style="color:${color};font-size:13px">${v.cor}/${v.tot}</span></div>`;
  });
  document.getElementById('sum-breakdown').innerHTML = brkHTML;

  showScreen('screen-summary');
  renderDashboard();
}

// ─── MISS REPORT ─────────────────────────────────────────────────
function showMissReport() {
  const missed = QUESTIONS.filter(q => {
    const p = STATE.progress[q.id];
    return p && p.attempts > 0 && p.correct === 0;
  });
  const examFilter = STATE.exam;
  const filtered = missed.filter(q => q.exam === examFilter || STATE.exam === 'both');

  document.getElementById('miss-subtitle').textContent =
    `${filtered.length} question(s) never answered correctly · ${examFilter === 'core1' ? 'Core 1' : 'Core 2'}`;

  if (!filtered.length) {
    document.getElementById('miss-list').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text2)">No missed questions! Great work.</div>';
  } else {
    document.getElementById('miss-list').innerHTML = filtered.map(q => `
      <div class="miss-item">
        <div style="font-size:11px;color:var(--text2)">${q.exam==='core1'?'Core 1':'Core 2'} · Obj ${q.objective}</div>
        <div style="font-size:13px;margin-top:4px">${q.question}</div>
        <div style="font-size:11px;color:var(--green);margin-top:4px">Correct: ${q.options[q.correct]}</div>
        <div style="font-size:11px;color:var(--text2);margin-top:2px">${q.explanation.substring(0,100)}...</div>
      </div>`).join('');
  }
  showScreen('screen-miss');
}

// ─── DRILL WEAK SPOTS ────────────────────────────────────────────
function drillWeakSpots() {
  const exam = STATE.exam;
  const weak = QUESTIONS.filter(q => {
    if (q.exam !== exam) return false;
    const p = STATE.progress[q.id];
    if (!p || !p.attempts) return true; // never seen
    return p.correct === 0; // never got right
  });
  const pool = shuffle([...weak]).slice(0, 30);
  if (!pool.length) { alert('No weak spots! Try a regular quiz.'); return; }
  startQuiz(pool);
}

// ─── UTILS ───────────────────────────────────────────────────────
function confirmReset() {
  if (confirm(`Reset all progress for ${STATE.user}? This cannot be undone.`)) {
    STATE.progress = {};
    saveProgress();
    renderDashboard();
    alert('Progress reset.');
  }
}

// Override recordResult to also track session
const _origRecord = recordResult;
STATE.sessionResults = {};
function recordResult(qid, correct) {
  if (!STATE.progress[qid]) STATE.progress[qid] = {answered:0, correct:0, attempts:0};
  STATE.progress[qid].attempts++;
  STATE.progress[qid].answered = true;
  if (correct) STATE.progress[qid].correct++;
  STATE.sessionResults[qid] = correct;
  saveProgress();
}

// init
document.getElementById('setup-exam').onchange = updateDomainOptions;
</script>
